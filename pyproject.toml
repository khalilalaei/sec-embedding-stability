[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-embedding-stability"
version = "0.2.0"
description = "Independent SEC filing representation stability research starter"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scikit-learn>=1.4,<2", "scipy>=1.11,<2"]

[project.optional-dependencies]
brief = ["reportlab>=4,<5"]
market = ["yfinance>=0.2.66,<2", "exchange-calendars>=4.5,<5"]
extract = ["lxml>=5,<7"]
report = ["matplotlib>=3.8,<4"]
embed = ["sentence-transformers>=5.0,<6", "transformers>=4.51,<5", "huggingface-hub>=0.30,<1", "torch>=2.2,<3"]

[project.scripts]
secstab = "secstab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
